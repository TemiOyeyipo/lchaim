<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Johari Window</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#142033; --paper:#F2F4F7; --white:#fff; --line:#D3D9E1; --muted:#586477;
    --arena:#2E9E6B; --blind:#D93A3A; --facade:#E59A00; --unknown:#8a94a3;
    --ui:'Bricolage Grotesque', system-ui, sans-serif;
    --read:'Source Serif 4', Georgia, serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5}
  h1,h2,h3{font-weight:800;line-height:1.15;margin:0;letter-spacing:-.02em}
  p{margin:0 0 1em}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:var(--white)}
  .logo{height:34px;width:auto;display:block}
  .link{background:none;border:0;padding:8px 0;text-decoration:underline;text-underline-offset:3px;font-weight:600;color:inherit}
  main{max-width:820px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,40px)}
  footer{max-width:820px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 40px;color:var(--muted);font-size:14px}

  .btn{display:inline-block;border:0;border-radius:999px;padding:14px 28px;font-weight:700;background:var(--ink);color:#fff;min-height:48px}
  .btn[disabled]{opacity:.35;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}

  h1.page{font-size:clamp(30px,5.5vw,46px);margin-bottom:12px}
  .lede{font-family:var(--read);font-size:19px;color:#2b3850;max-width:38em}

  form.stack{display:grid;gap:14px;margin-top:20px;max-width:460px}
  label{display:grid;gap:6px;font-weight:600;font-size:15px}
  input{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
  .fine{font-size:14px;color:var(--muted);margin:0}
  .err{color:#B3261E;font-weight:600;min-height:1.4em;margin:0}

  .picker{margin-top:24px}
  .picker-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .count{font-weight:700;font-size:15px}
  .grid{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;background:#fff;font-weight:600;font-size:15px;min-height:44px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip[disabled]{opacity:.35;cursor:not-allowed}

  .center{text-align:center;padding:60px 0}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto 16px;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1.5px dashed var(--muted);border-radius:12px;padding:14px 16px;margin:18px 0}
  .linkbox code{font-size:13px;word-break:break-all;flex:1;min-width:200px}

  .prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:18px 0 6px}
  .prog i{display:block;height:100%;background:var(--ink);transition:width .4s}

  .quad{border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;background:#fff;border-top:8px solid var(--qc)}
  .quad h3{font-size:19px;margin-bottom:2px}
  .quad .sub{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:10px}
  .quad p{font-family:var(--read);font-size:16px}
  .words{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .word{background:var(--paper);border-radius:6px;padding:6px 12px;font-weight:700;font-size:14px}
  .word small{color:var(--muted);font-weight:600;margin-left:4px}
  .tip{font-size:14px;background:var(--paper);border-radius:10px;padding:10px 14px;margin-top:8px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
</style>
</head>
<body>
<header class="top">
  <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <svg class="logo" viewBox="0 0 540 120" role="img" aria-label="L'chaim: Nourishing Life &amp; Spirit">
      <g transform="translate(10, 0)">
        <path d="M 55 18 L 55 10 M 39 24 L 34 19 M 71 24 L 76 19 M 28 40 L 20 38 M 82 40 L 90 38"
              stroke="#D4A359" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
        <path d="M 30 65 A 28 28 0 1 1 80 65"
              fill="none" stroke="#2C3E35" stroke-width="3.8" stroke-linecap="round"/>
        <path d="M 55 38 C 36 55 32 78 55 94 C 78 78 74 55 55 38 Z" fill="#4A6B5D" opacity="0.95"/>
        <path d="M 55 94 C 50 81 50 65 55 54 C 60 65 60 81 55 94 Z" fill="#C87D55"/>
      </g>
      <text x="125" y="66" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="700" letter-spacing="2.8" fill="#2C3E35">L'chaim</text>
      <text x="127" y="88" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.5" fill="#C87D55" opacity="0.95">NOURISHING LIFE &amp; SPIRIT</text>
    </svg>
    <span style="width:1.5px;height:24px;background:var(--line)"></span>
    <span style="font-size:15px;color:var(--muted);font-weight:800">Johari Window</span>
  </div>
  <a class="link" href="index.html">DISC portal</a>
</header>
<main id="app" aria-live="polite"></main>
<footer id="footNote"></footer>

<script src="config.js"></script>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const call = (fn, params) => fetch(CONFIG.API_URL, {
  method: 'POST',
  body: JSON.stringify({ fn, ...(params || {}) })
})
  .then(res => res.json())
  .then(data => {
    if (!data || !data.ok) throw new Error((data && data.error) || 'Something went wrong. Please try again.');
    return data.data;
  })
  .catch(err => { throw new Error(err.message || 'Could not reach the server. Please try again.'); });

const params = new URLSearchParams(location.search);
const sid = params.get('s');
$('#footNote').textContent = 'The Johari Window compares self-perception with colleague perception. It is a reflection tool, not a clinical assessment.';

function loading(text) {
  app.innerHTML = `<div class="center"><div class="spin"></div><p>${esc(text)}</p></div>`;
}

/** Renders a word-picker chip grid into `el`, calling onChange(selected[]) on every toggle. Returns a getter for the current selection. */
function renderPicker(el, words, min, max, preset) {
  const selected = new Set(preset || []);
  function paint() {
    el.querySelector('.count').textContent = `${selected.size} selected (choose ${min}–${max})`;
    el.querySelectorAll('.chip').forEach(b => {
      const on = selected.has(b.dataset.w);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
      b.disabled = !on && selected.size >= max;
    });
    el.dispatchEvent(new CustomEvent('pickchange', { detail: [...selected] }));
  }
  el.innerHTML = `
    <div class="picker-head"><span class="count"></span></div>
    <div class="grid">${words.map(w => `<button type="button" class="chip" data-w="${esc(w)}" aria-pressed="false">${esc(w)}</button>`).join('')}</div>`;
  el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const w = b.dataset.w;
    if (selected.has(w)) selected.delete(w); else if (selected.size < max) selected.add(w);
    paint();
  }));
  paint();
  return () => [...selected];
}

/* ---------- Start screen ---------- */
async function viewStart(msg) {
  loading('Loading the word list');
  let meta;
  try { meta = await call('johariGetAdjectives'); }
  catch (e) { app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }

  app.innerHTML = `
    <h1 class="page">See yourself the way colleagues see you.</h1>
    <p class="lede">Pick the words that describe you. Then invite a few colleagues to do the same about you, privately. Where your answers agree or differ becomes your Johari Window.</p>
    <form class="stack" id="startForm" novalidate>
      <label>Full name<input id="name" autocomplete="name" required></label>
      <label>Email<input id="email" type="email" autocomplete="email" required></label>
      <label>Role (optional)<input id="role"></label>
      <label>Team or group (optional)<input id="team"></label>
    </form>
    <div class="picker">
      <h3>Choose the words that describe you</h3>
      <div id="picker"></div>
    </div>
    <p class="err" id="err" role="alert">${esc(msg || '')}</p>
    <div class="actions"><button class="btn" type="button" id="go">Start — get my invite link</button></div>`;

  const getSelected = renderPicker($('#picker'), meta.adjectives, meta.min, meta.max, []);

  $('#go').addEventListener('click', async () => {
    const name = $('#name').value.trim(), email = $('#email').value.trim();
    const role = $('#role').value.trim(), team = $('#team').value.trim();
    const adjectives = getSelected();
    if (!name) return ($('#err').textContent = 'Enter your name to continue.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return ($('#err').textContent = 'Enter a valid email address.');
    if (adjectives.length < meta.min || adjectives.length > meta.max) {
      return ($('#err').textContent = `Choose between ${meta.min} and ${meta.max} words.`);
    }
    loading('Setting up your session');
    try {
      const res = await call('johariCreateSession', { payload: { name, email, role, team, adjectives } });
      viewInvite(res);
    } catch (e) { viewStart(e.message); }
  });
}

  function viewInvite(res) {
  // Build from the current directory, not by guessing the current filename/extension —
  // robust even if this page is served without ".html" (a "pretty URL" host).
  const dir = location.href.slice(0, location.href.lastIndexOf('/') + 1).split('?')[0].split('#')[0];
  const peerLink = res.peerLink || `${dir}johari-peer.html?s=${res.sessionId}`;
  const selfLink = res.selfLink || `${dir}johari.html?s=${res.sessionId}`;
  app.innerHTML = `
    <h1 class="page">Your invite link is ready.</h1>
    <p class="lede">Send this to a few colleagues — a manager, a peer, someone you work with often. We also emailed it to you.</p>
    <div class="linkbox"><code id="peerLink">${esc(peerLink)}</code><button class="btn ghost" type="button" id="copyPeer">Copy</button></div>
    <p class="fine">Your results unlock once at least ${res.minPeers} people respond — so no single answer can be traced back to them.</p>
    <p class="fine">Bookmark this link to check your results later:</p>
    <div class="linkbox"><code>${esc(selfLink)}</code><button class="btn ghost" type="button" id="copySelf">Copy</button></div>
    <div class="actions"><button class="btn" type="button" id="checkNow">Check my results now</button></div>`;
  $('#copyPeer').addEventListener('click', () => { navigator.clipboard.writeText(peerLink); $('#copyPeer').textContent = 'Copied'; });
  $('#copySelf').addEventListener('click', () => { navigator.clipboard.writeText(selfLink); $('#copySelf').textContent = 'Copied'; });
  $('#checkNow').addEventListener('click', () => {
    history.replaceState(null, '', '?s=' + res.sessionId);
    viewAuth(res.sessionId);
  });
}


/* ---------- Reopen / results ---------- */
function viewAuth(sessionId, msg) {
  app.innerHTML = `
    <h1 class="page">Check your Johari Window</h1>
    <p class="lede">Enter the email you used to start this session.</p>
    <form class="stack" id="authForm" novalidate>
      <label>Email<input id="email" type="email" autocomplete="email" required></label>
      <p class="err" id="err" role="alert">${esc(msg || '')}</p>
      <button class="btn" type="submit">View my results</button>
    </form>`;
  $('#authForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const email = $('#email').value.trim();
    loading('Checking your results');
    try {
      const data = await call('johariGetSession', { sessionId, email });
      data.ready ? viewResults(data, email) : viewWaiting(data, email);
    } catch (e) { viewAuth(sessionId, e.message); }
  });
}

function viewWaiting(data, email) {
  const pct = Math.min(100, Math.round((data.totalPeers / data.minPeers) * 100));
  const dir = location.href.slice(0, location.href.lastIndexOf('/') + 1).split('?')[0].split('#')[0];
  const peerLink = `${dir}johari-peer.html?s=${data.sessionId}`;
  app.innerHTML = `
    <h1 class="page">Almost there, ${esc(String(data.name).split(' ')[0])}.</h1>
    <p class="lede">Your results unlock once ${data.minPeers} colleagues respond, so no single answer stands out.</p>
    <p style="font-weight:700">${data.totalPeers} of ${data.minPeers} responses received</p>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <p class="fine" style="margin-top:18px">Share this link with more colleagues:</p>
    <div class="linkbox"><code>${esc(peerLink)}</code><button class="btn ghost" type="button" id="copyPeer">Copy</button></div>
    <div class="actions">
      <button class="btn" type="button" id="refresh">Check again</button>
      <button class="btn ghost" type="button" id="back">Back</button>
    </div>`;
  $('#copyPeer').addEventListener('click', () => { navigator.clipboard.writeText(peerLink); $('#copyPeer').textContent = 'Copied'; });
  $('#refresh').addEventListener('click', async () => {
    loading('Checking your results');
    try {
      const fresh = await call('johariGetSession', { sessionId: data.sessionId, email });
      fresh.ready ? viewResults(fresh, email) : viewWaiting(fresh, email);
    } catch (e) { viewWaiting(data, email); }
  });
  $('#back').addEventListener('click', () => { history.replaceState(null, '', location.pathname); viewStart(); });
}
function wordsBlock(items, showCount, cls) {
  if (!items.length) return '<p class="fine">No words landed here this time.</p>';
  return `<div class="words">${items.map(it => {
    const w = showCount ? it.word : it;
    const n = showCount && it.count ? `<small>${it.count}</small>` : '';
    return `<span class="word" style="border-left:4px solid var(${cls})">${esc(w)}${n}</span>`;
  }).join('')}</div>`;
}

function viewResults(r, email) {
  const rel = Object.keys(r.relationships || {}).map(k => `${r.relationships[k]} ${esc(k)}`).join(', ');
  app.innerHTML = `
    <h1 class="page">${esc(String(r.name).split(' ')[0])}'s Johari Window</h1>
    <p class="lede">${esc(r.intro)}</p>
    <p class="fine">Feedback from ${r.totalPeers} ${r.totalPeers === 1 ? 'colleague' : 'colleagues'}${rel ? ' (' + rel + ')' : ''}.</p>

    <div class="quad" style="--qc:var(--arena)">
      <h3>${esc(r.info.arena.title)}</h3><div class="sub">${esc(r.info.arena.subtitle)}</div>
      <p>${esc(r.info.arena.desc)}</p>
      ${wordsBlock(r.arena, true, '--arena')}
      <div class="tip"><b>Try this:</b> ${esc(r.info.arena.tip)}</div>
    </div>

    <div class="quad" style="--qc:var(--blind)">
      <h3>${esc(r.info.blind.title)}</h3><div class="sub">${esc(r.info.blind.subtitle)}</div>
      <p>${esc(r.info.blind.desc)}</p>
      ${wordsBlock(r.blind, true, '--blind')}
      <div class="tip"><b>Try this:</b> ${esc(r.info.blind.tip)}</div>
    </div>

    <div class="quad" style="--qc:var(--facade)">
      <h3>${esc(r.info.facade.title)}</h3><div class="sub">${esc(r.info.facade.subtitle)}</div>
      <p>${esc(r.info.facade.desc)}</p>
      ${wordsBlock(r.facade, false, '--facade')}
      <div class="tip"><b>Try this:</b> ${esc(r.info.facade.tip)}</div>
    </div>

    <div class="quad" style="--qc:var(--unknown)">
      <h3>${esc(r.info.unknown.title)}</h3><div class="sub">${esc(r.info.unknown.subtitle)}</div>
      <p>${esc(r.info.unknown.desc)}</p>
      <p><b>${r.unknownCount}</b> of ${r.totalWords} words were not picked by you or by anyone who responded.</p>
      <div class="tip"><b>Try this:</b> ${esc(r.info.unknown.tip)}</div>
    </div>

    <p class="fine">${esc(r.disclaimer)}</p>
    <div class="actions">
      <button class="btn" type="button" id="pdf">Download PDF report</button>
      <button class="btn ghost" type="button" id="again">Start a new one</button>
    </div>
    <p class="err" id="pdfErr" role="alert"></p>`;

  $('#pdf').addEventListener('click', async () => {
    const btn = $('#pdf'), err = $('#pdfErr');
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'Preparing PDF';
    try {
      const f = await call('johariGetPdf', { sessionId: r.sessionId, email });
      const bytes = Uint8Array.from(atob(f.base64), ch => ch.charCodeAt(0));
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      const a = document.createElement('a');
      a.href = url; a.download = f.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Download PDF report';
    }
  });
  $('#again').addEventListener('click', () => { history.replaceState(null, '', location.pathname); viewStart(); });
  window.scrollTo({ top: 0 });
}

/* ---------- Boot ---------- */
if (sid) viewAuth(sid); else viewStart();
</script>
</body>
</html>
